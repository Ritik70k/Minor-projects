<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="display">
            <input type="text" id="text">
        </div>
        <div class="btn">
            <div class="box-btn bg-white-gray">
                <img id="backspace" src="icons/backspace.svg" alt="">
            </div>
            <div class="box-btn bg-white-gray">AC</div>
            <div class="box-btn bg-white-gray">%</div>
            <div class="box-btn bg-yellow">/</div>
            <div class="box-btn bg-gray">7</div>
            <div class="box-btn bg-gray">8</div>
            <div class="box-btn bg-gray">9</div>
            <div class="box-btn bg-yellow">*</div>
            <div class="box-btn bg-gray">4</div>
            <div class="box-btn bg-gray">5</div>
            <div class="box-btn bg-gray">6</div>
            <div class="box-btn bg-yellow">-</div>
            <div class="box-btn bg-gray">1</div>
            <div class="box-btn bg-gray">2</div>
            <div class="box-btn bg-gray">3</div>
            <div class="box-btn bg-yellow">+</div>
            <div class="box-btn col-span-2 bg-gray">0</div>
            <div class="box-btn bg-gray">.</div>
            <div class="box-btn bg-yellow">=</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
